    "huggingface-hub==1.10.1",
    "jmespath==1.0.1",
    "joblib==1.5.3",
    "lazy_loader==0.5",
    "librosa==0.11.0",
    "llama-index-core==0.14.20",
    "llama-index-llms-bedrock-converse==0.14.5",
    "llvmlite==0.47.0",
    "numba==0.65.0",
    "numpy==2.4.4",
    "pandas==2.2.3",
    "pooch==1.9.0",
    "pydantic==2.12.5",
    "resampy==0.4.3",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "soundfile==0.13.1",
    "soxr==1.0.0",
    "starlette==1.3.1",
