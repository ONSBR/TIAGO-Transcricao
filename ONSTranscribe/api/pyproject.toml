# Correcao de seguranca (advisory). Dependencia TRANSITIVA (chega via alembic),
# por isso entra como constraint (piso de versao) e nao como pin direto: constraints
# nao adicionam dependencia nova ao ambiente, apenas impedem o resolvedor de
# escolher uma versao vulneravel do que ja seria instalado.
[tool.uv]
constraint-dependencies = [
    "mako>=1.3.12",  # GHSA-jgxj-r6vp-cfpg / GHSA-mgqv-cq7g-2c3r
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
include = ["app*"] # Glob patterns for packages to include
exclude = ["terraform*"] # Glob patterns for packages/directories to exclude

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
