[project]
name = "subject-classification"
version = "0.1.0"
description = "Multi-label text classification pipeline for transcriptions using embeddings (OpenAI), TF-IDF, SVM/LightGBM and LLM-based approaches."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=6.30.1",
    "iterative-stratification>=0.1.9",
    "joblib>=1.5.2",
    "lightgbm>=4.6.0",
    "llama-index>=0.14.2",
    "matplotlib>=3.10.6",
    "nbformat>=5.10.4",
    "nltk>=3.10.3",
    "openai>=1.0.0",
    "openpyxl>=3.1.5",
    # pandas era resolvido transitivamente via llama-index-readers-file, que o
    # llama-index >=0.14.4 não puxa mais; os notebooks importam pandas direto.
    # Cap em <3 para manter a série que os notebooks já usavam (2.2.3 no lock antigo).
    "pandas>=2.2.3,<3",
    "plotly>=6.3.0",
    "scikit-learn>=1.7.2",
    "umap-learn>=0.5.9.post2",
    "unidecode>=1.4.0",
]

[project.optional-dependencies]
# Descomente o provider LLM que você vai usar no pure_LLM.ipynb
bedrock  = ["boto3>=1.40.34", "llama-index-llms-bedrock>=0.4.2"]
openai   = ["llama-index-llms-openai>=0.1.0"]
anthropic = ["llama-index-llms-anthropic>=0.1.0"]

[tool.uv]
# Pisos mínimos de segurança para dependências transitivas (advisories resolvidos).
# Não são dependências diretas: só se aplicam se o pacote já estiver no grafo.
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "banks>=2.4.5",
    "fonttools>=4.60.2",
    "idna>=3.15",
    "marshmallow>=3.26.2",
    "pillow>=12.3.0",
    "pyasn1>=0.6.4",
    "pygments>=2.20.0",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "setuptools>=83.0.0",
    "soupsieve>=2.8.4",
    "tornado>=6.5.8",
    "urllib3>=2.7.0",
]
